          static void *nf(const char *name) {
            int i; char b[120]; void *p;
            for (i = 0; i < nnat; i++) if (!strcmp(nats[i].name, name)) return nats[i].fn;
            snprintf(b, sizeof b, "Java_org_fmod_FMODAudioDevice_%s", name);   /* M1: FMOD diekspor langsung (bukan RegisterNatives) */
            for (i = 0; i < nmods; i++) if ((p = mod_find(&mods[i], b))) return p;
            L("[native] %s TIDAK terdaftar\n", name); return NULL;
          }
          static void *g_nenv, *g_nobj;
