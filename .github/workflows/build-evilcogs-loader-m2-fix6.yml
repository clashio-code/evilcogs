          static void nx_post(NxEv *e) {
            int nx;
            nx_init();
            pthread_mutex_lock(&g_nx.mu);
            nx = (g_nx.wr + 1) % NXQ;
            if (nx == g_nx.rd) { pthread_mutex_unlock(&g_nx.mu); free(e); return; }
            g_nx.q[g_nx.wr] = e; g_nx.wr = nx;
            pthread_mutex_unlock(&g_nx.mu);
            g_nx_posted++;
            nx_wakeup();
          }
