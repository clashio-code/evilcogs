          for k in range(233):
              nm = n[k]
              if nm.startswith("Call") and ("LongMethod" in nm or "DoubleMethod" in nm):
                  if "Nonvirtual" in nm:
                      o.append("static uint64_t jstub_%d(void *e, void *o, void *c, void *m) { (void)e; g_jrecv = o; (void)c; return jcall64(%d, m); }" % (k, k))
                  else:
                      o.append("static uint64_t jstub_%d(void *e, void *o, void *m) { (void)e; g_jrecv = o; return jcall64(%d, m); }" % (k, k))
              elif "Nonvirtual" in nm and nm.startswith("Call"):
                  o.append("static uint32_t jstub_%d(void *e, void *o, void *c, void *m) { (void)e; g_jrecv = o; (void)c; return jcall(%d, m); }" % (k, k))
              elif nm == "NewObjectV":
                  o.append("static uint32_t jstub_%d(void *e, void *o, void *m, va_list ap) { (void)e; g_jrecv = o; return jnewobj_v(%d, m, ap); }" % (k, k))
              elif nm == "NewObjectA":
                  o.append("static uint32_t jstub_%d(void *e, void *o, void *m, const void *a) { (void)e; g_jrecv = o; return jnewobj_a(%d, m, a); }" % (k, k))
              elif nm == "NewObject":
                  o.append("static uint32_t jstub_%d(void *e, void *o, void *m) { (void)e; g_jrecv = o; return jnewobj(%d, m); }" % (k, k))
              elif nm.startswith("Call") and nm.endswith("MethodV"):
                  o.append("static uint32_t jstub_%d(void *e, void *o, void *m, va_list ap) { (void)e; g_jrecv = o; return jcall_v(%d, m, ap); }" % (k, k))
              elif nm.startswith("Call") and nm.endswith("MethodA"):
                  o.append("static uint32_t jstub_%d(void *e, void *o, void *m, const void *a) { (void)e; g_jrecv = o; return jcall_a(%d, m, a); }" % (k, k))
              elif nm.startswith("Call") and nm.endswith("Method"):
                  o.append("static uint32_t jstub_%d(void *e, void *o, void *m, ...) { va_list ap; uint32_t r; (void)e; g_jrecv = o; va_start(ap, m); r = jcall_v(%d, m, ap); va_end(ap); return r; }" % (k, k))
              elif nm.startswith("Call") or nm.startswith("NewObject") and nm != "NewObjectArray":
                  o.append("static uint32_t jstub_%d(void *e, void *o, void *m) { (void)e; g_jrecv = o; return jcall(%d, m); }" % (k, k))
              else:
                  o.append("static uint32_t jstub_%d(void) { return jtrap(%d); }" % (k, k))
          o.append("static void *const jstubs[233] = {")
          o.append("  " + ", ".join("(void *)jstub_%d" % k for k in range(233)))
          o.append("};")
          open("stubs.inc", "w").write("\n".join(o) + "\n")
          print("stubs.inc ok:", len(n), "slot")
          EOF_PY
          cat > src/launcher.tpl <<'EOF_TPL'
          #!/bin/bash
          # Evil Cogs Android loader (M1). MODE: @MODE@
          # Folder data dicari seperti launcher PortMaster lain: /$directory/ports/evilcogs_android

          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}

          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
            controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi

          source $controlfolder/control.txt
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"

          GAMEDIR="/$directory/ports/evilcogs_android"
          [ -d "$GAMEDIR" ] || GAMEDIR="$(cd "$(dirname "$0")" && pwd)/evilcogs_android"

          cd "$GAMEDIR" || {
            echo "folder evilcogs_android tidak ketemu: /$directory/ports/evilcogs_android" > "$(dirname "$0")/loader_error.txt"
            exit 1
          }

          export LD_LIBRARY_PATH="/usr/lib32:/lib32:${LD_LIBRARY_PATH}"
          chmod +x ./evilcogsloader 2>/dev/null
          echo "GAMEDIR=$GAMEDIR  mode=@MODE@" > loader_stdout.txt

          # Ambil library 32-bit dari APK otomatis bila belum ada (butuh perintah unzip di perangkat)
          if [ ! -f libs/libunity.so ] || [ ! -f libs/libil2cpp.so ] || [ ! -f libs/libmain.so ]; then
            if [ -f evilcogs.apk ] && command -v unzip >/dev/null 2>&1; then
              mkdir -p libs
              unzip -o -j evilcogs.apk 'lib/armeabi-v7a/libunity.so' 'lib/armeabi-v7a/libil2cpp.so' 'lib/armeabi-v7a/libmain.so' -d libs >> loader_stdout.txt 2>&1
            fi
          fi

          if [ ! -f libs/libunity.so ] || [ ! -f libs/libil2cpp.so ] || [ ! -f libs/libmain.so ] || [ ! -f ./evilcogsloader ]; then
            echo "libs/libunity.so, libs/libil2cpp.so, libs/libmain.so atau evilcogsloader belum ada di $GAMEDIR (lihat libs/TARUH-LIB-DI-SINI.txt)" >> loader_stdout.txt
            sleep 3
            exit 1
          fi

          export SDL_GAMECONTROLLERCONFIG="$sdl_controllerconfig"
          rm -f loader_log.txt
          for d in /usr/lib32/spa-0.2 /lib32/spa-0.2 /usr/lib/arm-linux-gnueabihf/spa-0.2; do [ -d "$d" ] && export SPA_PLUGIN_DIR="$d" && break; done
          for d in /usr/lib32/pipewire-0.3 /lib32/pipewire-0.3 /usr/lib/arm-linux-gnueabihf/pipewire-0.3; do [ -d "$d" ] && export PIPEWIRE_MODULE_DIR="$d" && break; done
          for d in /usr/lib32/alsa-lib /lib32/alsa-lib /usr/lib/arm-linux-gnueabihf/alsa-lib; do [ -d "$d" ] && export ALSA_PLUGIN_DIR="$d" && break; done
          [ -f evilcogs.apk ] || echo "PERINGATAN: evilcogs.apk tidak ada di $GAMEDIR (salin APK Evil Cogs dan namai evilcogs.apk)" >> loader_stdout.txt
          LOADER_ARGS="$(cat loader.args 2>/dev/null)"
          ./evilcogsloader libs $LOADER_ARGS @ARG@ >> loader_stdout.txt 2>&1
          echo "exit code: $?" >> loader_stdout.txt
          sleep 2
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF_TPL
          echo "--stage 3 --timeout 90 --apk evilcogs.apk" > out/evilcogs_android/loader.args
          echo "Biasanya TIDAK PERLU: launcher mengambil library otomatis dari evilcogs.apk (butuh perintah unzip). Kalau gagal, ambil libunity.so, libil2cpp.so dan libmain.so dari lib/armeabi-v7a/ di dalam APK Evil Cogs (BUKAN lib/x86) lalu taruh di folder ini. Salin juga APK ke folder evilcogs_android dengan nama evilcogs.apk. Jangan di-upload ke GitHub." > out/evilcogs_android/libs/TARUH-LIB-DI-SINI.txt

      - name: Buat stub JNI dan skrip peluncur
        run: |
          cd src && python3 gen_stubs.py && cd ..
          sed -e 's/@MODE@/STAGE dari loader.args/' -e 's/@ARG@//' src/launcher.tpl > out/EvilCogs.sh
          sed -e 's/@MODE@/DRY (stage 0)/' -e 's/@ARG@/--dry/' src/launcher.tpl > out/EvilCogs_dry.sh
          sed -e 's/@MODE@/STAGE 1 (konstruktor)/' -e 's/@ARG@/--stage 1/' src/launcher.tpl > out/EvilCogs_stage1.sh
          sed -e 's/@MODE@/STAGE 2 (JNI_OnLoad)/' -e 's/@ARG@/--stage 2 --timeout 120/' src/launcher.tpl > out/EvilCogs_stage2.sh
          sed -e 's/@MODE@/STAGE 3 (M2: render)/' -e 's/@ARG@/--stage 3 --timeout 90/' src/launcher.tpl > out/EvilCogs_stage3.sh
          bash -n out/EvilCogs.sh
          bash -n out/EvilCogs_dry.sh
          bash -n out/EvilCogs_stage1.sh
          bash -n out/EvilCogs_stage2.sh
          bash -n out/EvilCogs_stage3.sh

      - name: Kompilasi (armhf)
        run: |
          arm-linux-gnueabihf-gcc -O2 -Wall -Wextra -Wno-missing-field-initializers -Wno-unused-function -Isrc -o out/evilcogs_android/evilcogsloader src/evilcogsloader.c -ldl -lpthread -lm
          file out/evilcogs_android/evilcogsloader || true
          echo "--- library yang dibutuhkan:"
          arm-linux-gnueabihf-readelf -d out/evilcogs_android/evilcogsloader | grep NEEDED
          MAXV=$(arm-linux-gnueabihf-readelf -V out/evilcogs_android/evilcogsloader | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "evilcogsloader butuh GLIBC tertinggi: $MAXV (device: 2.37)"
          if [ "$(printf '%s\n%s\n' 2.37 "$MAXV" | sort -V | tail -1)" != "2.37" ]; then
            echo "GAGAL: evilcogsloader butuh glibc lebih baru dari 2.37. Simbol penyebab:"
            arm-linux-gnueabihf-nm -D --undefined-only out/evilcogs_android/evilcogsloader | grep -E 'GLIBC_2\.(3[89]|[4-9][0-9])'
            exit 1
          fi

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: evilcogs-loader-armhf-fix6
          path: out
