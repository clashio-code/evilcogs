                uint8_t *comp; uint32_t dataoff;
                fseek(f, (long)lho, SEEK_SET);
                if (fread(lh, 1, 30, f) != 30 || rd32(lh) != 0x04034b50u) break;
                dataoff = lho + 30 + rd16(lh + 26) + rd16(lh + 28);
                comp = malloc(csz ? csz : 1); fseek(f, (long)dataoff, SEEK_SET);
                if (!comp || fread(comp, 1, csz, f) != csz) { free(comp); break; }
                if (method == 0) { res = comp; *outn = csz; }
                else if (method == 8) {
                  PState s; uint8_t *o = malloc(usz ? usz : 1); int r;
                  memset(&s, 0, sizeof s); s.in = comp; s.inlen = csz; s.out = o; s.outlen = usz;
                  r = o ? pinflate(&s) : -99;
                  if (r == 0 && s.outcnt == usz) { res = o; *outn = usz; } else { L("[zip] inflate gagal (%d) untuk %s\n", r, entry); free(o); }
                  free(comp);
                } else { L("[zip] metode kompresi %u tidak didukung (%s)\n", method, entry); free(comp); }
                break;
              }
              p += 46 + nl + xl + cl;
            }
            free(cd); fclose(f);
            return res;
          }

          static uint8_t *file_read_all(const char *path, size_t *outn) {
            FILE *f = fopen(path, "rb"); long n; uint8_t *b;
            *outn = 0;
            if (!f) return NULL;
            fseek(f, 0, SEEK_END); n = ftell(f); fseek(f, 0, SEEK_SET);
            if (n < 0) { fclose(f); return NULL; }
            b = malloc(n ? (size_t)n : 1);
            if (!b || fread(b, 1, (size_t)n, f) != (size_t)n) { fclose(f); free(b); return NULL; }
            fclose(f); *outn = (size_t)n;
            return b;
          }
