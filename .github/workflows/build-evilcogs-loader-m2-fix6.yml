          static int nx_ALooper_pollAll(int timeout, int *fd, int *ev, void **data) {
            nx_init();
            for (;;) {
              struct pollfd p; int r;
              if (g_nx.attached && nx_has()) {
                if (fd) *fd = g_nx.pr;
                if (ev) *ev = 1;
                if (data) *data = g_nx.cbdata;
                if (g_nx.cb) { ((int (*)(int, int, void *))g_nx.cb)(g_nx.pr, 1, g_nx.cbdata); return -2; }
                return g_nx.ident;
              }
              if (g_nx.wake) { g_nx.wake = 0; if (fd) *fd = 0; if (ev) *ev = 0; if (data) *data = NULL; return -1; }
              p.fd = g_nx.pr; p.events = POLLIN; p.revents = 0;
              r = poll(&p, 1, timeout);
              if (r > 0) { char buf[64]; while (read(g_nx.pr, buf, sizeof buf) > 0) { } continue; }
              if (r == 0) { if (fd) *fd = 0; if (ev) *ev = 0; if (data) *data = NULL; return -3; }
              if (errno == EINTR) continue;
              return -4;
