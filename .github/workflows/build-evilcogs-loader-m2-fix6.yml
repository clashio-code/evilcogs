          /* Diagnosis layar hitam: pada swap tertentu baca balik framebuffer default (SEBELUM HUD digambar) dan catat
           * jumlah piksel non-hitam, viewport, FBO aktif, glGetError. Tidak mengubah state GL (FBO dikembalikan). */
          static void gl_diag(int n) {
            typedef void (*fn_gi)(unsigned, int *);
            typedef void (*fn_rp)(int, int, int, int, unsigned, unsigned, void *);
            typedef void (*fn_bf)(unsigned, unsigned);
            typedef unsigned (*fn_ge)(void);
            static fn_gi gGetI; static fn_rp gRead; static fn_bf gBind; static fn_ge gErr; static unsigned char *buf;
            int fbo = -1, vp[4] = {0, 0, 0, 0}, w, h, i, nb = 0, fx = -1, fy = -1; unsigned err; unsigned long sr = 0, sg = 0, sb = 0;
            if (!gGetI) { *(void **)&gGetI = glsym("glGetIntegerv"); *(void **)&gRead = glsym("glReadPixels"); *(void **)&gBind = glsym("glBindFramebuffer"); *(void **)&gErr = glsym("glGetError"); }
            if (!gGetI || !gRead || !gBind || !gErr) { L("[diag] simbol GL tidak lengkap\n"); return; }
            if (!buf) buf = malloc(1024 * 1024 * 4);
            if (!buf) return;
            gGetI(0x8CA6, &fbo); gGetI(0x0BA2, vp);
            err = gErr();
            w = (vp[2] > 0 && vp[2] <= 1024) ? vp[2] : 640; h = (vp[3] > 0 && vp[3] <= 1024) ? vp[3] : 480;
            gBind(0x8D40, 0);
            gRead(0, 0, w, h, 0x1908, 0x1401, buf);
            for (i = 0; i < w * h; i++) {
              const unsigned char *p = buf + 4 * i;
              if (p[0] > 8 || p[1] > 8 || p[2] > 8) { if (fx < 0) { fx = i % w; fy = i / w; } nb++; sr += p[0]; sg += p[1]; sb += p[2]; }
            }
            gBind(0x8D40, (unsigned)fbo);
            L("[diag] swap#%d fbo_aktif=%d viewport=%d,%d,%d,%d glerr=0x%x piksel_nonhitam=%d/%d rata2=(%d,%d,%d) pertama=(%d,%d) sudut=%02x%02x%02x%02x\n",
              n, fbo, vp[0], vp[1], vp[2], vp[3], err, nb, w * h, nb ? (int)(sr / nb) : 0, nb ? (int)(sg / nb) : 0, nb ? (int)(sb / nb) : 0, fx, fy, buf[0], buf[1], buf[2], buf[3]);
          }
          static int b_eglSwapBuffers(void *d, void *s) {
            if (!g_nx_mode || !p_SDL_GL_SwapWindow || !g_win) return old_eglSwapBuffers(d, s);
            g_nx_swaps++;
            if (g_nx_swaps <= 5 || g_nx_swaps == 30 || g_nx_swaps % 120 == 0) {
              L("[gt] swap#%d: draw_sejak_swap_lalu=%d draw_ke_fb0=%d shader_ok=%d shader_gagal=%d link_ok=%d link_gagal=%d progbin=%d shbin=%d fbo_tidak_lengkap=%d\n", g_nx_swaps, g_gt_draw, g_gt_d0, g_gt_shok, g_gt_shbad, g_gt_lkok, g_gt_lkbad, g_gt_pbin, g_gt_sbin, g_gt_fbbad);
              if (g_nx_swaps == 30 || g_nx_swaps % 120 == 0) g_gt_q = 12;
            }
            if (g_nx_swaps == 1 || g_nx_swaps == 5 || g_nx_swaps == 30 || g_nx_swaps == 240 || g_nx_swaps == 480 || g_nx_swaps == 600) { g_gt_pn = g_nx_swaps; g_gt_probe = 1; g_gt_postq = 8; g_gt_cq = 8; }
            gt_blit();
            g_gt_d0 = 0; g_gt_draw = 0;
            if (g_nx_swaps == 1 || g_nx_swaps == 5 || g_nx_swaps == 30 || g_nx_swaps == 120 || g_nx_swaps == 400 || g_nx_swaps == 900) gl_diag(g_nx_swaps);
            pad_draw(); p_SDL_GL_SwapWindow(g_win);
            return 1;
          }
