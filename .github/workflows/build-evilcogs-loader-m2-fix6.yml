          /* ======================= M1: tiruan sisi framework Android NDK (NativeActivity) =======================
           * Unity 4.x mode NativeActivity: libmain.so (kode Unity sendiri) menjalankan thread utama + looper + antrean input, dan libunity
           * mengambil input lewat ekspor libmain. Di sini yang ditiru hanya sisi framework: ALooper, AInputQueue, AInputEvent/AMotionEvent/AKeyEvent,
           * AConfiguration, ASensor getter, ANativeWindow acquire/release. Fungsi yang mengembalikan float memakai AAPCS (softfp) seperti Bionic armv7. */
          typedef struct NxEv { int type, source, dev, action, key, meta, edge, flags, n; int id[10]; float x[10], y[10], pr[10], sz[10]; int64_t down, t; } NxEv;
          #define NXQ 256
          static struct { NxEv *q[NXQ]; int rd, wr, attached, ident, inited, pr, pw; volatile int wake; void *cb, *cbdata; pthread_mutex_t mu; } g_nx;
          static int g_nx_looper[4];
