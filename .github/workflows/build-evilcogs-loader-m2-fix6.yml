          static fn_inj_t g_ninject;
          static int64_t now_ms(void) { struct timespec ts; clock_gettime(CLOCK_MONOTONIC, &ts); return (int64_t)ts.tv_sec * 1000 + ts.tv_nsec / 1000000; }

          /* ---- gamepad: 2 mode ----
           * mode 0 = KURSOR     : D-pad / stik kiri gerak kursor, A/B/X/Y = tap di posisi kursor (cara lama)
           * mode 1 = CONTROLLER : tombol fisik -> sentuhan multitouch di posisi tombol HUD Cordy (kiri/kanan/lompat/aksi/pause/topi).
           *                       Stik kanan = kursor sementara (muncul 3 dtk), R2/L2/R3/L3 = tap di kursor (untuk menu & popup).
           * Ganti mode: ketuk SELECT (tekan lalu lepas tanpa tombol lain). Select+Start tetap keluar. Pilihan terakhir disimpan di padmode.txt.
           * Posisi tombol HUD bisa diubah tanpa build ulang lewat buttons.cfg (koordinat layar 640x480, kiri-atas = 0,0). */
          #define MAXF 6
          enum { H_LEFT, H_RIGHT, H_JUMP, H_ACT, H_PAUSE, H_HAT, H_N };
          enum { SB_DPAD = 1, SB_STICK = 2, SB_A = 4, SB_B = 8, SB_X = 16, SB_Y = 32, SB_L1 = 64, SB_R1 = 128, SB_START = 256 };
          typedef struct { const char *name; float x, y; int src; } Hud;
          static Hud g_hud[H_N] = {
            { "left", 50.f, 352.f, 0 }, { "right", 137.f, 410.f, 0 }, { "jump", 582.f, 346.f, 0 },
            { "action", 508.f, 408.f, 0 }, { "pause", 597.f, 72.f, 0 }, { "hat", 597.f, 125.f, 0 } };
          static struct { int used, key; float x, y; } g_fg[MAXF];
          static int g_sel_used, g_pad_log, g_btn_back, g_btn_start, g_dp[4], g_dp_hold, g_axv[6], g_padmode;
          static int g_tapsrc, g_touch_down, g_stkl, g_stkr, g_trig[2], g_toast = 150, g_curshow, g_rs_hold;
          static float g_cx = 320.f, g_cy = 240.f;
          /* nativeTouch(int id, float x, float y, int action, long time, int SOURCE). Native Unity 3.5 hanya membalik sumbu Y (koordinat atas-kiri -> bawah-kiri)
           * dan menskala bila source == 0x1002 (SOURCE_TOUCHSCREEN); dengan source=0 ketukan jatuh di Y yang tercermin (480-y) -> "tombol tidak berfungsi". */
          #define SRC_TOUCHSCREEN 0x1002
          static int g_ntap_log;
          /* M1.2: sentuhan multi-jari -> AMotionEvent lewat antrean input libmain/libunity. Dipanggil dari touch_ev: g_fg[] sudah memuat jari ini
           * (down: used=1 sebelum panggilan; up: used masih 1 sampai setelah panggilan), jadi jumlah jari n sudah benar untuk kode aksi Android. */
          static void nx_touch_ev(int id, int action, float x, float y) {
            static int64_t down; static int nlog;
            NxEv *e = (NxEv *)calloc(1, sizeof *e); int i, n = 0, idx = 0, act;
            if (!e) return;
            for (i = 0; i < MAXF && n < 10; i++) if (g_fg[i].used) {
              if (i == id) idx = n;
              e->id[n] = i; e->x[n] = g_fg[i].x; e->y[n] = g_fg[i].y; e->pr[n] = 1.f; e->sz[n] = 0.1f; n++;
            }
            if (n == 0) { e->id[0] = id; e->x[0] = x; e->y[0] = y; e->pr[0] = 1.f; e->sz[0] = 0.1f; n = 1; idx = 0; }
            act = (action == 2) ? 2 : (action == 0) ? (n == 1 ? 0 : (5 | (idx << 8))) : (n == 1 ? 1 : (6 | (idx << 8)));
            if (action == 0 && n == 1) down = nx_now_ns();
            e->type = 2; e->source = 0x1002; e->dev = 2; e->action = act; e->n = n; e->down = down ? down : nx_now_ns(); e->t = nx_now_ns();
            if (action != 2 && nlog < 200) { nlog++; L("[touch] %s jari#%d x=%.0f y=%.0f (jari aktif=%d)\n", action == 0 ? "TURUN" : "naik", id, (double)x, (double)y, n); }
            nx_post(e);
          }
          static void touch_ev(int id, int action, float x, float y) {
            if (g_nx_mode) { nx_touch_ev(id, action, x, y); return; }
            if (g_ntap_log < 120 && action != 2) { g_ntap_log++; L("[touch] id=%d action=%d x=%.0f y=%.0f (source=0x%x)\n", id, action, (double)x, (double)y, SRC_TOUCHSCREEN); }
            if (g_ntouch) { g_ntouch(g_nenv, g_nobj, id, x, y, action, now_ms(), SRC_TOUCHSCREEN); return; }
          if (g_ninject) {   /* bangun MotionEvent palsu berisi semua jari aktif */
            int i, n = 0, idx = 0, act, r;
            if (!g_mevobj) g_mevobj = jstrobj("android/view/MotionEvent");
            for (i = 0; i < MAXF && n < 10; i++) if (g_fg[i].used) { if (i == id) idx = n; g_mev.id[n] = i; g_mev.x[n] = g_fg[i].x; g_mev.y[n] = g_fg[i].y; n++; }
            if (n == 0) { g_mev.id[0] = id; g_mev.x[0] = x; g_mev.y[0] = y; n = 1; idx = 0; }
            g_mev.n = n;
            act = (action == 2) ? 2 : (action == 0) ? (n == 1 ? 0 : (5 | (idx << 8))) : (n == 1 ? 1 : (6 | (idx << 8)));
            g_mev.action = act; g_mev.t = now_ms();
            r = g_ninject(g_nenv, g_nobj, g_mevobj);
            if (g_mev_log < 30 && action != 2) { g_mev_log++; L("[mev] nativeInjectEvent action=0x%x n=%d x=%.0f y=%.0f -> %d\n", act, n, (double)x, (double)y, r); }
          }
          }
          /* kolam jari: id sentuh = slot bebas terendah (seperti pointerId Android); jari pertama = id 0 (juga dipakai emulasi mouse Unity) */
          static void ft_down(int key, float x, float y) {
            int i;
            for (i = 0; i < MAXF; i++) if (g_fg[i].used && g_fg[i].key == key) return;
            for (i = 0; i < MAXF; i++) if (!g_fg[i].used) { g_fg[i].used = 1; g_fg[i].key = key; g_fg[i].x = x; g_fg[i].y = y; touch_ev(i, 0, x, y); return; }
          }
          static void ft_move(int key, float x, float y) {
            int i;
            for (i = 0; i < MAXF; i++) if (g_fg[i].used && g_fg[i].key == key) { g_fg[i].x = x; g_fg[i].y = y; touch_ev(i, 2, x, y); return; }
          }
          static void ft_up(int key) {
            int i;
            for (i = 0; i < MAXF; i++) if (g_fg[i].used && g_fg[i].key == key) { touch_ev(i, 1, g_fg[i].x, g_fg[i].y); g_fg[i].used = 0; return; }
          }
          static void pad_init(void) {
            int i, n;
          #define OSYM(nm) (*(void **)&p_##nm = dlsym(sdl_h, #nm))
            OSYM(SDL_InitSubSystem); OSYM(SDL_NumJoysticks); OSYM(SDL_JoystickOpen); OSYM(SDL_JoystickName); OSYM(SDL_IsGameController); OSYM(SDL_GameControllerOpen);
          #undef OSYM
            *(void **)&p_glEnable = glfn("glEnable"); *(void **)&p_glDisable = glfn("glDisable"); *(void **)&p_glScissor = glfn("glScissor");
            *(void **)&p_glClearColor = glfn("glClearColor"); *(void **)&p_glClear = glfn("glClear"); *(void **)&p_glGetIntegerv = glfn("glGetIntegerv");
            *(void **)&p_glGetFloatv = glfn("glGetFloatv"); *(void **)&p_glIsEnabled = glfn("glIsEnabled");
            if (!p_SDL_InitSubSystem || p_SDL_InitSubSystem(0x00000200u | 0x00002000u) != 0) { L("[pad] init joystick/controller gagal\n"); return; }
            n = p_SDL_NumJoysticks ? p_SDL_NumJoysticks() : 0;
            L("[pad] joystick terdeteksi: %d\n", n);
            for (i = 0; i < n; i++) {
              void *j = p_SDL_JoystickOpen ? p_SDL_JoystickOpen(i) : NULL;
              int gc = p_SDL_IsGameController ? p_SDL_IsGameController(i) : 0;
              L("[pad] #%d nama=\"%s\" gamecontroller=%d\n", i, (j && p_SDL_JoystickName) ? p_SDL_JoystickName(j) : "?", gc);
              if (gc && p_SDL_GameControllerOpen) p_SDL_GameControllerOpen(i);
            }
          }
          static const char *skipnum(const char *p) {
            while (*p == ' ' || *p == '\t') p++;
            while (*p && *p != ' ' && *p != '\t' && *p != '\n' && *p != '\r') p++;
            return p;
          }
          /* buttons.cfg: satu baris per tombol, "nama x y" (nama: left right jump action pause hat), '#' = komentar. padmode.txt: pilihan mode terakhir. */
          static void pad_cfg_load(void) {
            FILE *f = fopen("buttons.cfg", "r");
            char ln[160];
            int h;
            if (!f) L("[pad] buttons.cfg tidak ada, pakai posisi bawaan\n");
            else {
              while (fgets(ln, sizeof ln, f)) {
                char *p = ln, *nm;
                while (*p == ' ' || *p == '\t') p++;
                if (*p == '#' || *p == '\n' || *p == '\r' || *p == 0) continue;
                nm = p;
                while (*p && *p != ' ' && *p != '\t') p++;
                if (!*p) continue;
                *p++ = 0;
                for (h = 0; h < H_N; h++) if (!strcmp(g_hud[h].name, nm)) { g_hud[h].x = (float)atof(p); g_hud[h].y = (float)atof(skipnum(p)); }
              }
              fclose(f);
            }
            for (h = 0; h < H_N; h++) L("[pad] HUD %-6s = (%.0f, %.0f)\n", g_hud[h].name, (double)g_hud[h].x, (double)g_hud[h].y);
            f = fopen("padmode.txt", "r");
            if (f) {
              if (fgets(ln, sizeof ln, f)) { if (!strncmp(ln, "controller", 10)) g_padmode = 1; else if (!strncmp(ln, "cursor", 6)) g_padmode = 0; }
              fclose(f);
            }
            L("[pad] mode awal: %s  (ganti: ketuk SELECT)\n", g_padmode ? "CONTROLLER" : "KURSOR");
          }
          static void hud_set(int h, int bit, int on) {
            int was = g_hud[h].src != 0;
            if (on) g_hud[h].src |= bit; else g_hud[h].src &= ~bit;
            if (!was && g_hud[h].src) ft_down(10 + h, g_hud[h].x, g_hud[h].y);
            else if (was && !g_hud[h].src) ft_up(10 + h);
          }
          static void cur_tap(int bit, int on) {
            int was = g_tapsrc != 0;
            if (on) g_tapsrc |= bit; else g_tapsrc &= ~bit;
            if (!was && g_tapsrc) { ft_down(100, g_cx, g_cy); g_touch_down = 1; }
            else if (was && !g_tapsrc) { ft_up(100); g_touch_down = 0; }
            if (on) g_curshow = 180;
          }
          static void pad_release_all(void) {
            int i;
            for (i = 0; i < MAXF; i++) if (g_fg[i].used) { touch_ev(i, 1, g_fg[i].x, g_fg[i].y); g_fg[i].used = 0; }
            for (i = 0; i < H_N; i++) g_hud[i].src = 0;
            g_tapsrc = 0; g_touch_down = 0; g_stkl = g_stkr = 0; g_trig[0] = g_trig[1] = 0;
            memset(g_dp, 0, sizeof g_dp);
          }
          static void pad_toggle(void) {
            FILE *f;
            pad_release_all();
            g_padmode = !g_padmode; g_toast = 120; g_curshow = 0;
            L("[pad] mode -> %s\n", g_padmode ? "CONTROLLER" : "KURSOR");
            f = fopen("padmode.txt", "w");
            if (f) { fputs(g_padmode ? "controller\n" : "cursor\n", f); fclose(f); }
          }
          static void pad_map_cursor(int b, int dn) {
            if (b >= 11 && b <= 14) g_dp[b - 11] = dn;
            else if (b >= 0 && b <= 3) cur_tap(1 << b, dn);         /* A/B/X/Y = tap di posisi kursor (game sentuh murni) */
          }
          static void pad_map(int b, int dn) {
            if (g_padmode == 0) { pad_map_cursor(b, dn); return; }
            /* mode CONTROLLER tanpa stik kanan: TAHAN SELECT = D-pad/stik kiri jadi kursor, A/B/X/Y = ketuk di kursor (lepas SELECT = kembali ke tombol game) */
            if (g_btn_back && dn) { pad_map_cursor(b, 1); return; }
            if (!dn) pad_map_cursor(b, 0);   /* lepas sisa kursor/ketukan bila tombol dilepas setelah SELECT dilepas/ditahan */
            switch (b) {
              case 13: hud_set(H_LEFT, SB_DPAD, dn); break;
              case 14: hud_set(H_RIGHT, SB_DPAD, dn); break;
              case 0: hud_set(H_JUMP, SB_A, dn); break;
              case 1: hud_set(H_ACT, SB_B, dn); break;
              case 2: hud_set(H_HAT, SB_X, dn); break;
              case 3: hud_set(H_PAUSE, SB_Y, dn); break;
              case 9: hud_set(H_ACT, SB_L1, dn); break;
              case 10: hud_set(H_JUMP, SB_R1, dn); break;
              case 6: hud_set(H_PAUSE, SB_START, dn); break;
              case 7: case 8: cur_tap(16 << (b - 7), dn); break;       /* L3/R3 = tap di kursor */
              default: break;
            }
          }
          static void cur_move(float dx, float dy, int *hold) {
            float sp;
            if (dx == 0.f && dy == 0.f) { *hold = 0; return; }
            (*hold)++;
            sp = *hold < 12 ? 3.f : *hold < 30 ? 7.f : 14.f;
            g_cx += dx * sp; g_cy += dy * sp;
            if (g_cx < 0.f) g_cx = 0.f;
            if (g_cy < 0.f) g_cy = 0.f;
            if (g_cx > (float)(g_sw - 1)) g_cx = (float)(g_sw - 1);
            if (g_cy > (float)(g_sh - 1)) g_cy = (float)(g_sh - 1);
            if (g_touch_down) ft_move(100, g_cx, g_cy);
          }
          static float stick(int v) { return (v > 8000 || v < -8000) ? (float)v / 32768.f : 0.f; }
          static void pad_tick(void) {
            if (g_padmode == 0) {
              cur_move((float)(g_dp[3] - g_dp[2]) + stick(g_axv[0]), (float)(g_dp[1] - g_dp[0]) + stick(g_axv[1]), &g_dp_hold);
              return;
            }
            if (g_btn_back) {   /* SELECT ditahan: stik kiri + D-pad = kursor; HUD kiri/kanan dari stik dilepas */
              float dx = (float)(g_dp[3] - g_dp[2]) + stick(g_axv[0]), dy = (float)(g_dp[1] - g_dp[0]) + stick(g_axv[1]);
              g_stkl = g_stkr = 0; hud_set(H_LEFT, SB_STICK, 0); hud_set(H_RIGHT, SB_STICK, 0);
              if (dx != 0.f || dy != 0.f) { g_sel_used = 1; g_curshow = 180; }   /* sudah dipakai sebagai pengubah: melepas SELECT tidak mengganti mode */
              cur_move(dx, dy, &g_dp_hold);
              return;
            }
            /* controller: stik kiri = kiri/kanan (histeresis); stik kanan/pelatuk dipakai bila perangkat punya */
            g_stkl = g_stkl ? (g_axv[0] < -8000) : (g_axv[0] < -14000);
            g_stkr = g_stkr ? (g_axv[0] > 8000) : (g_axv[0] > 14000);
            hud_set(H_LEFT, SB_STICK, g_stkl);
            hud_set(H_RIGHT, SB_STICK, g_stkr);
            { float rx = stick(g_axv[2]), ry = stick(g_axv[3]);
              if (rx != 0.f || ry != 0.f) g_curshow = 180;
              cur_move(rx, ry, &g_rs_hold); }
            { int t0 = g_axv[4] > 16000, t1 = g_axv[5] > 16000;
              if (t0 != g_trig[0]) { g_trig[0] = t0; cur_tap(1, t0); }
              if (t1 != g_trig[1]) { g_trig[1] = t1; cur_tap(2, t1); } }
          }
          static void fill_rect(int x, int y, int w, int h, float r, float g, float b) {
            p_glClearColor(r, g, b, 1.f); p_glScissor(x, y, w, h); p_glClear(0x4000);
          }
          static void pad_draw(void) {   /* kursor (kotak putih berbingkai hitam) + penanda mode; glClear+scissor, state GL dipulihkan */
            int sb[4], x, y, show; float cc[4]; unsigned char was;
            show = (g_padmode == 0) || g_curshow > 0;
            if (g_padmode && g_curshow > 0) g_curshow--;
            if (!show && g_toast <= 0) return;
            if (!p_glClear || !p_glScissor || !p_glEnable || !p_glDisable || !p_glClearColor) return;
            sb[0] = 0; sb[1] = 0; sb[2] = g_sw; sb[3] = g_sh; cc[0] = cc[1] = cc[2] = 0.f; cc[3] = 1.f;
            was = p_glIsEnabled ? p_glIsEnabled(0x0C11) : 0;
            if (p_glGetIntegerv) p_glGetIntegerv(0x0C10, sb);
            if (p_glGetFloatv) p_glGetFloatv(0x0C22, cc);
            p_glEnable(0x0C11);
            if (show) {
              x = (int)g_cx; y = g_sh - (int)g_cy;
              fill_rect(x - 7, y - 7, 14, 14, 0.f, 0.f, 0.f);
              fill_rect(x - 5, y - 5, 10, 10, 1.f, 1.f, 1.f);
            }
            if (g_toast > 0) {              /* penanda mode di tengah-atas: hijau = CONTROLLER, putih = KURSOR */
              g_toast--;
              fill_rect(g_sw / 2 - 62, g_sh - 12, 124, 10, 0.f, 0.f, 0.f);
              if (g_padmode) fill_rect(g_sw / 2 - 60, g_sh - 10, 120, 6, 0.15f, 0.9f, 0.3f);
              else fill_rect(g_sw / 2 - 60, g_sh - 10, 120, 6, 1.f, 1.f, 1.f);
            }
            if (!was) p_glDisable(0x0C11);
            p_glScissor(sb[0], sb[1], sb[2], sb[3]);
            p_glClearColor(cc[0], cc[1], cc[2], cc[3]);
          }
          /* layout event SDL2 (32-bit): type@0, which@8, button/axis@12, state/value@13 (axis: int16 @16) */
          static void handle_event(const unsigned char *ev, int *quit) {
            uint32_t t; memcpy(&t, ev, 4);
            if (t == 0x100u) *quit = 1;
            else if (t == 0x300u) { int32_t sym; memcpy(&sym, ev + 20, 4); if (sym == 27) *quit = 1; }
            else if (t == 0x603u || t == 0x604u) { if (g_pad_log++ < 300) L("[pad] JOY button %d %s\n", ev[12], t == 0x603u ? "TURUN" : "naik"); }
            else if (t == 0x650u) { int16_t v; memcpy(&v, ev + 16, 2); if (ev[12] < 6) g_axv[ev[12]] = v; }
            else if (t == 0x651u || t == 0x652u) {
              int dn = (t == 0x651u), b = ev[12];
              if (g_pad_log++ < 300) L("[pad] CTRL button %d %s\n", b, dn ? "TURUN" : "naik");
              if (b == 4) { g_btn_back = dn; if (dn) g_sel_used = 0; else if (!g_sel_used) { pad_toggle(); return; } }   /* ketuk SELECT sendirian = ganti mode */
              if (b == 6) g_btn_start = dn;
              if (dn && g_btn_back && b != 4) g_sel_used = 1;     /* SELECT dipakai sebagai kombinasi -> jangan ganti mode saat dilepas */
              if (g_btn_back && g_btn_start) { *quit = 1; return; }      /* Select+Start = keluar */
              if (b == 4 || (b == 6 && g_btn_back)) return;
              pad_map(b, dn);
            }
          }

          /* ======================= FMOD jalur "AudioTrack" -> SDL audio =======================
           * Unity 3.5 memakai FMOD Ex statis di libunity.so dengan output AudioTrack. Di Android, kelas Java org.fmod.FMODAudioDevice
           * menjalankan thread: fmodGetInfo(0..4) -> buka AudioTrack -> loop { fmodProcess(ByteBuffer); track.write() }.
           * Libunity tidak memanggil Java untuk audio (tidak ada FindClass AudioTrack di log), jadi thread itu ditiru di sini:
           * dua native yang didaftarkan lewat RegisterNatives dipanggil langsung, PCM dikirim ke SDL lewat ring buffer.
           * fmodGetInfo: 0=sample rate, 1=panjang blok (sampel), 2=jumlah blok, 4=jumlah kanal.
           * FMOD baru siap setelah engine init, jadi dicoba berkala dari loop render sampai berhasil. */
          typedef struct { int freq; uint16_t format; uint8_t channels, silence; uint16_t samples, padding; uint32_t size;
                           void (*callback)(void *, uint8_t *, int); void *userdata; } AuSdlSpec;
          static void *au_dbuf(void *env, void *obj) { (void)env; return obj; }   /* GetDirectBufferAddress: "ByteBuffer" kita = pointer mentah */
          static int (*au_getinfo)(void *, void *, int);
          static int (*au_process)(void *, void *, void *);
          static volatile int g_au_quit;
          static int g_au_on, g_au_tries;
          static uint32_t g_au_dev;
          static void (*au_pause)(uint32_t, int);
          static uint8_t *au_ring; static uint32_t au_cap, au_fill, au_rd, au_wr;
          static pthread_mutex_t au_mu = PTHREAD_MUTEX_INITIALIZER; static pthread_cond_t au_cv = PTHREAD_COND_INITIALIZER;
          static unsigned au_underruns; static int au_blkbytes;

          static void au_cb(void *ud, uint8_t *out, int len) {
            uint32_t n, first;
            (void)ud;
            pthread_mutex_lock(&au_mu);
            n = au_fill < (uint32_t)len ? au_fill : (uint32_t)len;
            first = au_cap - au_rd; if (first > n) first = n;
            memcpy(out, au_ring + au_rd, first);
            if (n > first) memcpy(out + first, au_ring, n - first);
            au_rd = (au_rd + n) % au_cap; au_fill -= n;
            if (n < (uint32_t)len) { memset(out + n, 0, (size_t)len - n); au_underruns++; }
            pthread_cond_signal(&au_cv);
            pthread_mutex_unlock(&au_mu);
          }

          static void *au_thread(void *arg) {
            void *env = (void *)&g_env_p;
            uint8_t *blk = (uint8_t *)malloc((size_t)au_blkbytes + 4096);
            unsigned long nb = 0; int i;
            (void)arg;
            if (!blk) return NULL;
            while (!g_au_quit) {
              int r; uint32_t first;
              pthread_mutex_lock(&au_mu);
              while (!g_au_quit && au_cap - au_fill < (uint32_t)au_blkbytes) {
                struct timespec ts; clock_gettime(CLOCK_REALTIME, &ts); ts.tv_nsec += 4000000;
                if (ts.tv_nsec >= 1000000000L) { ts.tv_sec++; ts.tv_nsec -= 1000000000L; }
                pthread_cond_timedwait(&au_cv, &au_mu, &ts);
              }
              pthread_mutex_unlock(&au_mu);
              if (g_au_quit) break;
              r = au_process(env, NULL, blk);
              nb++;
              if (nb == 1 || nb == 100 || nb == 1000 || nb == 5000) {
                int peak = 0; const int16_t *s = (const int16_t *)blk;
                for (i = 0; i < au_blkbytes / 2; i++) { int v = s[i] < 0 ? -s[i] : s[i]; if (v > peak) peak = v; }
                L("[audio] blok #%lu: fmodProcess=%d puncak=%d underrun=%u\n", nb, r, peak, au_underruns);
              }
              pthread_mutex_lock(&au_mu);
              first = au_cap - au_wr; if (first > (uint32_t)au_blkbytes) first = (uint32_t)au_blkbytes;
              memcpy(au_ring + au_wr, blk, first);
              if ((uint32_t)au_blkbytes > first) memcpy(au_ring, blk + first, (uint32_t)au_blkbytes - first);
              au_wr = (au_wr + (uint32_t)au_blkbytes) % au_cap; au_fill += (uint32_t)au_blkbytes;
              pthread_mutex_unlock(&au_mu);
            }
            free(blk);
            return NULL;
          }

          /* return: 1 = audio jalan, 0 = FMOD belum siap (coba lagi nanti), -1 = gagal permanen (game tanpa suara) */
          static int audio_try_start(void) {
            void *env = (void *)&g_env_p; int rate, blk, ch, i;
            int (*initsub)(uint32_t) = NULL; uint32_t (*openf)(const char *, int, const AuSdlSpec *, AuSdlSpec *, int) = NULL;
            const char *(*geterr)(void) = NULL;
            AuSdlSpec want, have; uint32_t dev; pthread_t th; pthread_attr_t at;
            g_au_tries++;
            if (!au_getinfo) *(void **)&au_getinfo = nf("fmodGetInfo");
            if (!au_process) *(void **)&au_process = nf("fmodProcess");
            if (!au_getinfo || !au_process) { L("[audio] fmodGetInfo/fmodProcess tidak terdaftar -> game tanpa suara\n"); return -1; }
            g_jni[230] = (void *)au_dbuf;
            rate = au_getinfo(env, NULL, 0);
            if (rate <= 0) {
              if (g_au_tries == 1 || g_au_tries == 10 || g_au_tries == 100) L("[audio] FMOD belum siap (percobaan %d, rate=%d)\n", g_au_tries, rate);
              return 0;
            }
            for (i = 0; i < 5; i++) L("[audio] fmodGetInfo(%d) = %d\n", i, au_getinfo(env, NULL, i));
            blk = au_getinfo(env, NULL, 1); ch = au_getinfo(env, NULL, 4);
            if (blk <= 0 || blk > 16384) blk = 1024;
            if (ch < 1 || ch > 2) ch = 2;
            au_blkbytes = blk * ch * 2; au_cap = (uint32_t)au_blkbytes * 6;
            au_ring = (uint8_t *)calloc(1, au_cap);
            if (!au_ring) return -1;
            *(void **)&initsub = dlsym(sdl_h ? sdl_h : RTLD_DEFAULT, "SDL_InitSubSystem");
            *(void **)&openf = dlsym(sdl_h ? sdl_h : RTLD_DEFAULT, "SDL_OpenAudioDevice");
            *(void **)&au_pause = dlsym(sdl_h ? sdl_h : RTLD_DEFAULT, "SDL_PauseAudioDevice");
            *(void **)&geterr = dlsym(sdl_h ? sdl_h : RTLD_DEFAULT, "SDL_GetError");
            if (!initsub || !openf || !au_pause) { L("[audio] simbol SDL audio tidak ada -> game tanpa suara\n"); return -1; }
            if (initsub(0x00000010u) != 0) { L("[audio] SDL_InitSubSystem(AUDIO) gagal: %s\n", geterr ? geterr() : "?"); return -1; }
            memset(&want, 0, sizeof want); memset(&have, 0, sizeof have);
            want.freq = rate; want.format = 0x8010; want.channels = (uint8_t)ch; want.samples = 1024; want.callback = au_cb;
            { /* info ALSA + daftar driver SDL, lalu coba beberapa kombinasi sampai ada yang terbuka */
              int (*ndrv)(void) = NULL; const char *(*drvname)(int) = NULL; const char *(*curdrv)(void) = NULL;
              int (*audinit)(const char *) = NULL; void (*audquit)(void) = NULL;
              static const char *pref[] = { "pulseaudio", "alsa", "pipewire", NULL };
              static const char *adev[] = { NULL, "hw:0,0", "plughw:0,0", "hw:1,0", "plughw:1,0", "default", "sysdefault", NULL };
              int nd = 0, k, pi, ai; char line[256]; FILE *pf;
              *(void **)&ndrv = dlsym(sdl_h ? sdl_h : RTLD_DEFAULT, "SDL_GetNumAudioDrivers");
              *(void **)&drvname = dlsym(sdl_h ? sdl_h : RTLD_DEFAULT, "SDL_GetAudioDriver");
              *(void **)&curdrv = dlsym(sdl_h ? sdl_h : RTLD_DEFAULT, "SDL_GetCurrentAudioDriver");
              *(void **)&audinit = dlsym(sdl_h ? sdl_h : RTLD_DEFAULT, "SDL_AudioInit");
              *(void **)&audquit = dlsym(sdl_h ? sdl_h : RTLD_DEFAULT, "SDL_AudioQuit");
              if (ndrv && drvname) { nd = ndrv(); L("[audio] driver SDL tersedia:"); for (k = 0; k < nd; k++) L(" %s", drvname(k)); L(" | aktif: %s\n", curdrv && curdrv() ? curdrv() : "?"); }
              if ((pf = fopen("/proc/asound/cards", "r")) != NULL) { while (fgets(line, sizeof line, pf)) L("[audio] asound/cards: %s", line); fclose(pf); }
              if ((pf = fopen("/proc/asound/pcm", "r")) != NULL) { while (fgets(line, sizeof line, pf)) L("[audio] asound/pcm: %s", line); fclose(pf); }
              dev = openf(NULL, 0, &want, &have, 0);
              L("[audio] percobaan awal (driver otomatis, AUDIODEV=%s): %s\n", getenv("AUDIODEV") ? getenv("AUDIODEV") : "-", dev ? "OK" : (geterr ? geterr() : "?"));
              for (pi = 0; !dev && pref[pi] && audinit && audquit && drvname; pi++) {
                int have_drv = 0;
                for (k = 0; k < nd; k++) if (strcmp(drvname(k), pref[pi]) == 0) have_drv = 1;
                if (!have_drv) continue;
                for (ai = 0; !dev; ai++) {
                  if (ai > 0 && !adev[ai]) break;
                  if (ai > 0 && strcmp(pref[pi], "alsa") != 0) break;      /* AUDIODEV hanya relevan untuk ALSA */
                  if (adev[ai]) setenv("AUDIODEV", adev[ai], 1); else unsetenv("AUDIODEV");
                  audquit();
                  if (audinit(pref[pi]) != 0) { L("[audio] SDL_AudioInit(%s) gagal: %s\n", pref[pi], geterr ? geterr() : "?"); break; }
                  dev = openf(NULL, 0, &want, &have, 0);
                  L("[audio] coba driver=%s AUDIODEV=%s : %s\n", pref[pi], adev[ai] ? adev[ai] : "-", dev ? "OK" : (geterr ? geterr() : "?"));
                }
              }
              if (!dev) { L("[audio] SEMUA percobaan SDL audio gagal -> game tanpa suara\n"); return -1; }
              L("[audio] driver terpakai: %s\n", curdrv && curdrv() ? curdrv() : "?");
            }
            g_au_dev = dev;
            L("[audio] SDL terbuka: dev=%u minta=%dHz/%dch/s16 dapat=%dHz/%dch buf=%u | blok FMOD=%d sampel (%d byte)\n", dev, rate, ch, have.freq, have.channels, (unsigned)have.size, blk, au_blkbytes);
            pthread_attr_init(&at); pthread_attr_setstacksize(&at, 1u << 20);
            if (pthread_create(&th, &at, au_thread, NULL) != 0) { L("[audio] gagal membuat thread\n"); return -1; }
            pthread_detach(th);
            au_pause(dev, 0);
            { struct sigaction s2; int sg; static const int sgs[] = { SIGSEGV, SIGBUS, SIGILL, SIGFPE, SIGABRT };   /* SDL audio bisa menimpa handler sinyal kita */
              memset(&s2, 0, sizeof s2); s2.sa_sigaction = on_sig; s2.sa_flags = SA_SIGINFO | SA_ONSTACK;
              for (sg = 0; sg < 5; sg++) sigaction(sgs[sg], &s2, NULL); }
            L("[audio] thread FMOD->SDL jalan (setelah %d percobaan)\n", g_au_tries);
            g_au_on = 1;
            return 1;
          }
          static void audio_poll(int frame) {          /* dipanggil tiap frame dari loop render */
            if (g_au_on || g_au_tries >= 3000 || frame < 1 || frame % 20 != 0) return;
            if (audio_try_start() < 0) g_au_tries = 3000;
          }
          static void audio_stop(void) {
            if (!g_au_on) return;
            g_au_quit = 1;
            if (au_pause && g_au_dev) au_pause(g_au_dev, 1);
            pthread_cond_broadcast(&au_cv);
            { struct timespec ts; ts.tv_sec = 0; ts.tv_nsec = 80000000L; nanosleep(&ts, NULL); }
            L("[audio] berhenti (underrun total=%u)\n", au_underruns);
          }

          /* ======================= profiler sampling PC (diagnosa performa) =======================
           * ITIMER_PROF 100 Hz: hanya menghitung waktu CPU. Tiap 120 frame dicetak fungsi yang paling sering sedang berjalan.
           * "anon(JIT/lain)" = kode Mono JIT (memori anonim). Matikan dengan env MGN_NOPROF=1. */
          #include <sys/time.h>
          #define PS_MAX 4096
          static uintptr_t ps_buf[PS_MAX], ps_cp[PS_MAX];
          static volatile int ps_n;
          static int ps_on;
          static void on_prof(int sig, siginfo_t *si, void *ucp) {
            (void)sig; (void)si;
          #if defined(__arm__)
            if (ps_n < PS_MAX) ps_buf[ps_n++] = ((ucontext_t *)ucp)->uc_mcontext.arm_pc;
          #else
            (void)ucp;
          #endif
          }
          static void prof_start(void) {
            struct sigaction sa; struct itimerval it;
            if (getenv("MGN_NOPROF")) return;
            memset(&sa, 0, sizeof sa); sa.sa_sigaction = on_prof; sa.sa_flags = SA_SIGINFO | SA_RESTART | SA_ONSTACK; sigemptyset(&sa.sa_mask);
            sigaction(SIGPROF, &sa, NULL);
            it.it_interval.tv_sec = 0; it.it_interval.tv_usec = 10000; it.it_value = it.it_interval;
            setitimer(ITIMER_PROF, &it, NULL); ps_on = 1;
            L("[prof] sampling PC 100 Hz aktif (matikan: MGN_NOPROF=1)\n");
          }
          static void prof_name(uintptr_t pc, char *out, size_t n) {
            char d[220]; Dl_info di;
            describe(pc, d, sizeof d);
            if (d[0] != '?') {
              char *plus = strchr(d, '+'), *lp = strchr(d, '(');
              if (plus) *plus = 0;
              if (lp) { char *q = strrchr(lp, '+'); if (q) *q = 0; snprintf(out, n, "%s:%s", d, lp + 1); }
              else snprintf(out, n, "%s:?", d);
              return;
            }
            if (dladdr((void *)pc, &di) && di.dli_fname) {
              const char *b = strrchr(di.dli_fname, '/');
              snprintf(out, n, "%s:%s", b ? b + 1 : di.dli_fname, di.dli_sname ? di.dli_sname : "?");
            } else snprintf(out, n, "anon(JIT/lain)");
          }
          static void rd1(const char *p, char *o, size_t n) {
            FILE *f = fopen(p, "r"); size_t l; o[0] = 0;
            if (f) { if (fgets(o, (int)n, f)) { l = strlen(o); while (l && (o[l - 1] == '\n' || o[l - 1] == '\r')) o[--l] = 0; } fclose(f); }
          }
          static void prof_report(double el_ms) {
            static char nm[256][96]; static int ct[256];
            int n, nn = 0, i, j, step, used = 0, top; sigset_t b, o; char gov[48], fq[48];
            if (!ps_on) return;
            sigemptyset(&b); sigaddset(&b, SIGPROF); sigprocmask(SIG_BLOCK, &b, &o);
            n = ps_n; if (n > PS_MAX) n = PS_MAX; memcpy(ps_cp, ps_buf, (size_t)n * sizeof(uintptr_t)); ps_n = 0; sigprocmask(SIG_SETMASK, &o, NULL);
            rd1("/sys/devices/system/cpu/cpu0/cpufreq/scaling_governor", gov, sizeof gov);
            rd1("/sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq", fq, sizeof fq);
            L("[prof] CPU terpakai ~%.2f inti (%d sampel / %.0f ms) | governor=%s freq=%s kHz\n", n * 10.0 / (el_ms > 1 ? el_ms : 1), n, el_ms, gov[0] ? gov : "?", fq[0] ? fq : "?");
            step = n > 400 ? n / 400 : 1;
            for (i = 0; i < n; i += step) {
              char t[96];
              prof_name(ps_cp[i], t, sizeof t); used++;
              for (j = 0; j < nn; j++) if (!strcmp(nm[j], t)) { ct[j]++; break; }
              if (j == nn && nn < 256) { snprintf(nm[nn], sizeof nm[nn], "%s", t); ct[nn] = 1; nn++; }
            }
            for (top = 0; top < 8 && top < nn; top++) {
              int best = top;
              for (j = top + 1; j < nn; j++) if (ct[j] > ct[best]) best = j;
              if (best != top) { char tn[96]; int tc = ct[top]; memcpy(tn, nm[top], sizeof tn); memcpy(nm[top], nm[best], sizeof tn); ct[top] = ct[best]; memcpy(nm[best], tn, sizeof tn); ct[best] = tc; }
              L("[prof]   %4.1f%%  %s\n", used ? 100.0 * ct[top] / used : 0.0, nm[top]);
            }
          }

          static void run_stage3(const char *apk, int na, int nb, int frames) {
            int w = 640, h = 480, f, quit = 0, nerr = 0, r = 0;
            char libdir[480], files[480], cache[480];
            void *env = (void *)&g_env_p, *obj = jstrobj("com/unity3d/player/UnityPlayer");
            void *f_file = nf("nativeFile"), *f_initjni = nf("initJni"), *f_www = nf("nativeInitWWW"), *f_extras = nf("nativeSetExtras");
            void *f_init = nf("nativeInit"), *f_recreate = nf("nativeRecreateGfxState"), *f_resize = nf("nativeResize");
            void *f_uinit = nf("unityAndroidInit"), *f_uprep = nf("unityAndroidPrepareGameLoop"), *f_resume = nf("nativeResume");
            void *f_focus = nf("nativeFocusChanged"), *f_render = nf("nativeRender"), *f_pause = nf("nativePause");
            void *f_fwd = nf("nativeForwardEventsToDalvik");
            struct sigaction sa;
            g_nenv = env; g_nobj = obj;
            *(void **)&g_ntouch = nf("nativeTouch");
